apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: travelmapster-registry-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: travelmapster-registry-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"{{ .registry }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: registry
      remoteRef:
        key: apps/travelmapster/registry
        property: registry
    - secretKey: username
      remoteRef:
        key: apps/travelmapster/registry
        property: username
    - secretKey: password
      remoteRef:
        key: apps/travelmapster/registry
        property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: travelmapster-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: travelmapster-secret
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: apps/travelmapster/runtime
        property: database_password
    - secretKey: SESSION_SECRET
      remoteRef:
        key: apps/travelmapster/runtime
        property: session_secret

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: travelmapster-db-admin-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: travelmapster-db-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_ADMIN_USER
      remoteRef:
        key: infra/postgres
        property: username
    - secretKey: POSTGRES_ADMIN_PASSWORD
      remoteRef:
        key: infra/postgres
        property: password
