# Sessions and data live in PostgreSQL, so replicas are stateless and
# interchangeable; schema migrations serialize on an advisory lock.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelmapster
  namespace: apps
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: travelmapster
