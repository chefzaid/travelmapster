<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMapster</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <div id="sidebar">
        <h2>Travel Mapster</h2>

        <div id="auth-check" style="display:none;">
            <p>Welcome, <span id="username-display">User</span>!</p>
            <button id="logout-btn" class="btn btn-secondary">Logout</button>
            <div class="profile-settings">
                <label for="profile-visibility">Profile visibility</label>
                <select id="profile-visibility">
                    <option value="private">Private</option>
                    <option value="public">Public</option>
                </select>
                <button id="save-profile-btn" class="btn" style="margin-top: 5px;">Save Profile</button>
                <small id="profile-status" role="status" aria-live="polite"></small>
            </div>
        </div>

        <div id="auth-forms">
            <div class="auth-form active" id="login-form">
                <h3>Login</h3>
                <div class="input-group">
                    <input type="text" id="login-username" placeholder="Username">
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" placeholder="Password">
                </div>
                <button id="login-btn" class="btn">Login</button>
                <p>Don't have an account? <a href="#" id="show-register">Register</a></p>
            </div>

            <div class="auth-form" id="register-form">
                <h3>Register</h3>
                <div class="input-group">
                    <input type="text" id="reg-username" placeholder="Username">
                </div>
                <div class="input-group">
                    <input type="password" id="reg-password" placeholder="Password">
                </div>
                <button id="register-btn" class="btn">Register</button>
                <p>Already have an account? <a href="#" id="show-login">Login</a></p>
            </div>
        </div>

        <hr>

        <div id="controls" style="opacity: 0.5; pointer-events: none;"> <!-- Disabled until logged in -->
            <div class="pin-type-selector">
                <strong>Pin Type:</strong><br>
                <label>
                    <input type="radio" name="pinType" value="visited" checked> Visited
                </label>
                <label>
                    <input type="radio" name="pinType" value="wishlist"> Wishlist
                </label>
            </div>

            <div class="input-group">
                <label for="country-input">Pin Country</label>
                <input type="text" id="country-input" placeholder="Enter country name...">
                <button id="pin-country-btn" class="btn" style="margin-top: 5px;">Pin Country</button>
                <small>Or click on the map to pin a country.</small>
            </div>

            <div class="input-group">
                <label for="city-input">Pin City</label>
                <input type="text" id="city-input" placeholder="Enter city name...">
                <button id="pin-city-btn" class="btn" style="margin-top: 5px;">Pin City</button>
            </div>

            <div class="input-group">
                <label for="photo-url-input">Photo link (optional)</label>
                <input type="url" id="photo-url-input" placeholder="https://example.com/photo.jpg">
                <small>HTTP or HTTPS links are supported.</small>
            </div>

            <div class="input-group">
                <label for="notes-input">Notes (optional)</label>
                <textarea id="notes-input" maxlength="2000" placeholder="Add a note about this place..."></textarea>
            </div>

            <div class="input-group">
                <label for="travel-date-input">Travel date (optional)</label>
                <input type="date" id="travel-date-input">
            </div>

            <div class="filter-panel">
                <strong>Filter saved places</strong>
                <label for="type-filter">Pin type</label>
                <select id="type-filter">
                    <option value="all">All pins</option>
                    <option value="visited">Visited</option>
                    <option value="wishlist">Wishlist</option>
                </select>
                <label for="category-filter">Place type</label>
                <select id="category-filter">
                    <option value="all">Countries and cities</option>
                    <option value="Country">Countries</option>
                    <option value="City">Cities</option>
                </select>
            </div>

            <div class="search-panel">
                <label for="saved-place-search">Find a saved place</label>
                <input type="search" id="saved-place-search" list="saved-places-list" placeholder="Search countries or cities...">
                <datalist id="saved-places-list"></datalist>
                <button id="saved-place-search-btn" class="btn" style="margin-top: 5px;">Find Place</button>
                <small id="saved-place-search-status" role="status" aria-live="polite"></small>
            </div>

            <div class="stats-panel" aria-label="Trip statistics">
                <strong>Trip statistics</strong>
                <div class="stats-grid">
                    <div>
                        <span id="visited-countries-stat">0</span>
                        <small>Countries visited</small>
                    </div>
                    <div>
                        <span id="saved-cities-stat">0</span>
                        <small>Cities saved</small>
                    </div>
                    <div>
                        <span id="saved-places-stat">0</span>
                        <small>Total places</small>
                    </div>
                </div>
            </div>

            <div class="export-panel">
                <label for="export-format">Export saved places</label>
                <select id="export-format">
                    <option value="json">JSON</option>
                    <option value="csv">CSV</option>
                </select>
                <button id="export-places-btn" class="btn" style="margin-top: 5px;">Export Places</button>
                <small id="export-status" role="status" aria-live="polite"></small>
            </div>

            <div class="import-panel">
                <label for="import-file">Import saved places</label>
                <input type="file" id="import-file" accept=".json,.csv,application/json,text/csv">
                <button id="import-places-btn" class="btn" style="margin-top: 5px;">Import Places</button>
                <small id="import-status" role="status" aria-live="polite"></small>
            </div>
        </div>
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="script.js"></script>
    <script src="import.js"></script>
    <script src="profile.js"></script>
    <script src="photo.js"></script>
</body>
</html>
