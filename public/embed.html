<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n>Travel map · TravelMapster</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="/__assets__/css/tokens.css">

<body class="embed">
    <!-- A shared travel map for other websites to frame: read-only, without notes or photos. -->

        <div id="map" class="map" role="application" aria-label="World map of the countries and cities on this travel map." data-i18n-attr="aria-label"></div>

            <a id="embed-link" class="embed-link" href="/" target="_blank" rel="noopener" data-i18n>Open on TravelMapster ↗</a>
        </header>
    </main>
    <script type="module" src="/__assets__/js/embed.js"></script>
